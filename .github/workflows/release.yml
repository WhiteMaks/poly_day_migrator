name: Poly Day release microservice authenticate

on:
  push:
    branches: [ "release_**" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{vars.PROJECT_NAME}}
      MICROSERVICE_NAME: ${{vars.MICROSERVICE_NAME}}
      APP_NAME: ${{vars.PROJECT_NAME}}_${{vars.MICROSERVICE_NAME}}

    steps:
      - name: Preparing git branch
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Login into docker
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_ACCESS_TOKEN}}

      - name: Build docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/poly_day_migrator:${{github.ref_name}} .

      - name: Push docker tag
        run: docker push ${{secrets.DOCKER_USERNAME}}/poly_day_migrator:${{github.ref_name}}